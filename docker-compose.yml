# TechStream self-healing lab. Composes the whole application system: the web
# app plus the full monitoring and alerting stack.
#
# Lives at the repo root because it spans app/ and monitoring/, so neither
# directory owns it. Run every compose command from the repo root.
#
# All image versions are pinned. No :latest anywhere, so a rebuild months from
# now produces the same stack.
#
# The SSM remediation document runs:
#   cd /opt/techstream && docker compose restart app
# so the service below must stay named "app".

name: techstream

services:
  app:
    build:
      context: ./app
    image: techstream-app:1.0.0
    container_name: techstream-app
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-techstream-web}
      BASE_LATENCY_MS: ${BASE_LATENCY_MS:-25}
    ports:
      - "8080:8080"
    healthcheck:
      # /healthz is never subject to injected errors, so an unhealthy container
      # means a genuine problem rather than active chaos.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: techstream-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Lets the alert rules be reloaded with a POST to /-/reload instead of a
      # restart.
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: techstream-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: techstream-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # Fails to start with a clear message if this is not set in .env.
      # Better than silently defaulting to admin/admin on a public port.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Datasource and dashboard provider definitions
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSON itself, loaded by the provider above
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Host CPU and memory. Provides node_cpu_seconds_total,
  # node_memory_MemAvailable_bytes and node_memory_MemTotal_bytes.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: techstream-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    # Not published to the host. Prometheus reaches it over the compose network,
    # so there is no reason to widen the attack surface or the security group.
    expose:
      - "9100"

  # Per-container CPU. Provides container_cpu_usage_seconds_total with the
  # "name" label the saturation panel groups by.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: techstream-cadvisor
    restart: unless-stopped
    command:
      # Only watch Docker containers, not every cgroup on the host.
      - --docker_only=true
      - --housekeeping_interval=10s
      # Disk collectors are switched off deliberately. They walk the overlay2
      # directories to compute usage, which took 2 to 3 seconds per container on
      # this host and made the first few scrapes exceed the timeout, so the
      # target flapped down on every boot. The dashboard only needs
      # container_cpu_usage_seconds_total, so none of this is a loss.
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    # cAdvisor needs to read cgroups and the Docker state directory.
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"

  # Local stand-in for the remediation Lambda, so the self-healing loop can be
  # proven without AWS. Same webhook contract and same decision logic, but it
  # restarts through the Docker API instead of SSM.
  #
  # Behind a profile, so it does NOT start with a plain "docker compose up -d":
  #   docker compose --profile local-remediation up -d
  #
  # It mounts the Docker socket, which is root equivalent on the host. That is
  # acceptable for local verification and unacceptable on the instance, which is
  # why the deployed path uses Lambda plus SSM with a scoped IAM policy instead.
  # Never enable this profile on EC2.
  remediator:
    build:
      context: ./remediator
    image: techstream-remediator-local:1.0.0
    container_name: techstream-remediator
    profiles:
      - local-remediation
    restart: unless-stopped
    environment:
      WEBHOOK_TOKEN: ${REMEDIATION_WEBHOOK_TOKEN:?set REMEDIATION_WEBHOOK_TOKEN in .env}
      TARGET_CONTAINER: techstream-app
      EXPECTED_ALERTNAME: HighErrorRate
      MIN_SECONDS_BETWEEN_ACTIONS: ${MIN_SECONDS_BETWEEN_ACTIONS:-120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000"

  # Continuous low-rate traffic, so the app metrics always exist.
  #
  # This exists because of a real problem: prometheus_client only emits a
  # labelled counter after it has been incremented at least once. With no
  # traffic, http_requests_total does not exist at all, nothing is shipped to
  # Grafana Cloud, and the ML jobs have nothing to train on. A burst of traffic
  # followed by silence produces a series full of gaps.
  #
  # It also keeps the error ratio non-flat. Prophet cannot forecast a straight
  # line, and a perfectly healthy app holds the error ratio at exactly 0.
  # LOADGEN_ERROR_RATE keeps a small realistic error share in the signal, well
  # under the 5 percent alert threshold so it never triggers remediation.
  #
  # Behind a profile, so it never starts with a plain "docker compose up -d":
  #   docker compose --profile baseline up -d
  #   make baseline-up
  loadgen:
    image: curlimages/curl:8.10.1
    container_name: techstream-loadgen
    profiles:
      - baseline
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TARGET: http://app:8080
      RPS: ${LOADGEN_RPS:-5}
      ERROR_RATE: ${LOADGEN_ERROR_RATE:-0.015}
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        # $$VAR, not $${VAR}: a single $ would be expanded by Compose on the host
        # instead of by this shell inside the container.
        echo "loadgen: $$RPS req/s against $$TARGET, baseline error rate $$ERROR_RATE"
        n=0
        while true; do
          # Restore the baseline error rate about once a minute, but ONLY if it is
          # currently zero.
          #
          # Setting it once at startup is not enough: the rate lives in the app's
          # memory, so any restart silently resets it to 0, including a restart
          # caused by remediation. The error ratio then goes flat at zero, which
          # is the untrainable condition this service exists to prevent.
          #
          # The "only if zero" check is essential. chaos.sh sets the rate to 0.4,
          # and a loadgen that blindly re-asserted 0.015 every minute would pull
          # the ratio back under the 5 percent threshold mid-incident. The alert
          # would then never fire, or would resolve because the load generator
          # undid the experiment. Restore, never override.
          if [ "$$(( n % 60 ))" -eq 0 ]; then
            cur="$$(curl -s --max-time 5 "$$TARGET/healthz" \
              | sed -n 's/.*"error_rate":[ ]*\([0-9.]*\).*/\1/p')"
            case "$$cur" in
              0|0.0|0.00)
                curl -s -X POST "$$TARGET/chaos/errors?rate=$$ERROR_RATE" >/dev/null || true
                echo "loadgen: restored baseline error rate to $$ERROR_RATE"
                ;;
              "")
                # Could not read the app. Do nothing rather than guess, since
                # guessing wrong means overriding a live experiment.
                ;;
            esac
          fi
          i=0
          while [ "$$i" -lt "$$RPS" ]; do
            curl -s -o /dev/null --max-time 10 "$$TARGET/work" || true
            i=$$((i + 1))
          done
          n=$$((n + 1))
          sleep 1
        done

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
