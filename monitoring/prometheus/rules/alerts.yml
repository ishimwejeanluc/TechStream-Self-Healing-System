groups:
  - name: techstream-golden-signals
    interval: 15s
    rules:
      # The one alert wired to automated remediation.
      #
      # The expression is character for character the same one the Grafana error
      # ratio panel draws. The line you watch and the line that triggers a
      # restart are the same computation, so the dashboard can never disagree
      # with the alert.
      #
      # for: 1m means the ratio has to stay above 5 percent across four
      # consecutive 15s evaluations. A single bad scrape does not restart the
      # app.
      - alert: HighErrorRate
        expr: >-
          100 * sum(rate(http_requests_total{status=~"5.."}[1m]))
          / clamp_min(sum(rate(http_requests_total[1m])), 1) > 5
        for: 1m
        labels:
          severity: critical
          app: techstream-web
          # Read by the routing tree in alertmanager.yml. Only alerts carrying
          # this label reach the remediation webhook.
          remediation: restart
        annotations:
          summary: "Error ratio above 5 percent on techstream-web"
          description: >-
            The 5xx error ratio has been above 5 percent for at least 1 minute.
            Automated remediation will restart the app container, which clears
            the in-memory chaos state. Traffic in this lab is generated by
            chaos.sh, not by real users.
          # The Lambda reads this annotation and logs it alongside the SSM
          # command ID, so the remediation record says how bad it was.
          ratio: '{{ $value | printf "%.2f" }}'
          runbook: docs/RUNBOOK.md

      # Observation only. Deliberately NOT routed to remediation, because a
      # restart does nothing for genuine latency or CPU saturation. These exist
      # to give the RCA corroborating signals, and to prove the routing tree
      # only sends HighErrorRate to the Lambda.
      - alert: HighLatencyP95
        expr: >-
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
          app: techstream-web
          remediation: none
        annotations:
          summary: "p95 latency above 500ms on techstream-web"
          description: >-
            p95 request latency has been above 500ms for 2 minutes. No automated
            action is taken. A restart does not fix a saturated host.
          value: '{{ $value | printf "%.3f" }}s'

      - alert: HostCpuSaturation
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
          app: techstream-web
          remediation: none
        annotations:
          summary: "Host CPU busy above 85 percent"
          description: >-
            Sustained host CPU saturation. Scaling out is the appropriate
            response here, not a restart. See the scale-out option in the
            runbook.
          value: '{{ $value | printf "%.1f" }}%'
